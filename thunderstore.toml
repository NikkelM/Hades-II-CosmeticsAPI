[config]
schemaVersion = "0.0.1"


[package]
namespace = "NikkelM"
name = "Cosmetics_API"
versionNumber = "3.0.2"
description = "Developer library to simplify adding new cosmetics to Hades II. Allows adding variants of existing cosmetics, new card back packs, Chthonic Chids, familiar skins and even turning any obstacle into a cosmetic with variants. Does nothing by itself."
websiteUrl = "https://github.com/NikkelM/Hades-II-CosmeticsAPI"
containsNsfwContent = false

[package.dependencies]
Hell2Modding-Hell2Modding = "1.0.115"
LuaENVY-ENVY = "1.2.0"
SGG_Modding-Chalk = "2.1.2"
SGG_Modding-ReLoad = "1.0.3"
SGG_Modding-SJSON = "1.0.3"
SGG_Modding-ModUtil = "4.0.1"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "./CHANGELOG.md"

[[build.copy]]
source = "./LICENSE"
target = "./LICENSE"

[[build.copy]]
source = "./src"
target = "./plugins"


[publish]
repository = "https://thunderstore.io"
communities = [ "hades-ii", ]

[publish.categories]
hades-ii = [ "mods", "tools", "libraries", "cosmetics" ]
